<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Potassium Stock Tester</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #0f1117;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: min(900px, 92vw);
        }

        h1 {
            margin: 0 0 8px;
        }

        .subtitle {
            color: #9ca3af;
            margin-bottom: 25px;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .controls button {
            border: 0;
            border-radius: 8px;
            padding: 10px 16px;
            cursor: pointer;
            color: white;
            background: #5865f2;
            font-weight: 700;
        }

        .controls button:hover {
            opacity: .9;
        }

        /*
         * Important:
         * Potassium is INSIDE the button, matching
         * the structure your watcher searches for.
         */
        .weao-button {
            width: 300px;
            min-height: 330px;
            padding: 20px;
            border: 1px solid #292d38;
            border-radius: 14px;
            background: #191c24;
            color: white;
            cursor: pointer;
            text-align: left;
            transition: transform .15s, opacity .15s;
        }

        .weao-button:not(:disabled):hover {
            transform: translateY(-2px);
        }

        .weao-button:disabled {
            cursor: not-allowed;
            opacity: .7;
        }

        .lifetime {
            display: inline-block;
            padding: 5px 9px;
            margin-bottom: 15px;
            border-radius: 6px;
            background: #252936;
            color: #aaa;
            font-size: 12px;
        }

        .logo-container {
            width: 90px;
            height: 90px;
            margin-bottom: 15px;
            border-radius: 12px;
            overflow: hidden;
            background: #252936;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-name {
            margin: 10px 0;
            font-size: 23px;
            font-weight: 700;
        }

        .stock-status {
            display: block;
            margin-bottom: 18px;
            color: #f87171;
            font-size: 14px;
            font-weight: 600;
        }

        .stock-status.in-stock {
            color: #4ade80;
        }

        .buy-text {
            display: block;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            background: #5865f2;
            text-align: center;
            font-weight: 700;
        }

        #log {
            width: 100%;
            min-height: 130px;
            margin-top: 25px;
            padding: 15px;
            border: 1px solid #252936;
            border-radius: 10px;
            background: #090b10;
            color: #d1d5db;
            font-family: Consolas, monospace;
            font-size: 13px;
            white-space: pre-wrap;
        }

        .instructions {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: #161922;
            color: #9ca3af;
            font-size: 14px;
            line-height: 1.6;
        }

        code {
            color: #fff;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Potassium Stock Tester</h1>

    <div class="subtitle">
        Local mock storefront for testing a DOM stock watcher.
    </div>

    <div class="controls">
        <button id="stockButton">
            Put Potassium In Stock
        </button>

        <button id="outButton">
            Put Potassium Out of Stock
        </button>

        <button id="resetButton">
            Reset
        </button>
    </div>


    <!--
        This intentionally resembles the structure
        from the original Potassium card:

        <button>
            ...
            <p>Potassium</p>
            ...
            In Stock
        </button>
    -->

    <button
        type="button"
        class="weao-button"
        aria-disabled="true"
        disabled
    >

        <span class="lifetime">
            Lifetime
        </span>

        <span class="logo-container">
            <img
                alt=""
                src="https://cdn.weao.gg/slug/potassium/logo.png"
            >
        </span>

        <p class="product-name">
            Potassium
        </p>

        <span
            id="stockStatus"
            class="stock-status"
        >
            Out of stock
        </span>

        <span class="buy-text">
            Get Potassium
        </span>

    </button>


    <div id="log">Waiting for a test...</div>

    <div class="instructions">
        <strong>Test:</strong><br>
        1. Paste your watcher into the browser console.<br>
        2. Click <code>Put Potassium In Stock</code>.<br>
        3. The watcher should automatically click the Potassium card.<br>
        4. The log should show the detected click.
    </div>

</div>


<script>
    const potassiumButton =
        document.querySelector(".weao-button");

    const stockStatus =
        document.querySelector("#stockStatus");

    const log =
        document.querySelector("#log");


    function writeLog(message) {
        const time =
            new Date().toLocaleTimeString();

        log.textContent =
            `[${time}] ${message}\n` +
            log.textContent;
    }


    function setStock(inStock) {

        if (inStock) {

            stockStatus.textContent =
                "In Stock";

            stockStatus.classList.add(
                "in-stock"
            );

            potassiumButton.disabled =
                false;

            potassiumButton.removeAttribute(
                "disabled"
            );

            potassiumButton.setAttribute(
                "aria-disabled",
                "false"
            );

            writeLog(
                "Potassium changed to IN STOCK."
            );

        } else {

            stockStatus.textContent =
                "Out of stock";

            stockStatus.classList.remove(
                "in-stock"
            );

            potassiumButton.disabled =
                true;

            potassiumButton.setAttribute(
                "disabled",
                ""
            );

            potassiumButton.setAttribute(
                "aria-disabled",
                "true"
            );

            writeLog(
                "Potassium changed to OUT OF STOCK."
            );
        }
    }


    potassiumButton.addEventListener(
        "click",
        function () {

            writeLog(
                "CLICK DETECTED — Potassium button was clicked!"
            );

            const originalText =
                "Get Potassium";

            const buyText =
                potassiumButton.querySelector(
                    ".buy-text"
                );

            if (buyText) {

                buyText.textContent =
                    "CLICKED!";

                setTimeout(() => {
                    buyText.textContent =
                        originalText;
                }, 1000);
            }
        }
    );


    document
        .querySelector("#stockButton")
        .addEventListener(
            "click",
            function () {
                setStock(true);
            }
        );


    document
        .querySelector("#outButton")
        .addEventListener(
            "click",
            function () {
                setStock(false);
            }
        );


    document
        .querySelector("#resetButton")
        .addEventListener(
            "click",
            function () {

                setStock(false);

                log.textContent =
                    "Reset.";
            }
        );


    /*
     * Start in the same state as the original
     * example: Out of stock + disabled.
     */
    setStock(false);
</script>

</body>
</html>
